{% extends 'voterapp/base.html' %}

{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">🗳 Select Your Candidate</h2>

    <form method="POST" onsubmit="showLoading()">
        {% csrf_token %}

        <div class="row">
            {% for candidate in candidates %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center">

                        <h5 class="card-title">{{ candidate.name }}</h5>
                        <p class="card-text text-muted">{{ candidate.party }}</p>

                        <input type="radio"
                               name="candidate"
                               value="{{ candidate.id }}"
                               required>

                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center">

            <button type="submit"
                    id="voteBtn"
                    class="btn btn-success btn-lg">
                ✅ Cast My Vote
            </button>

            <div id="loadingMessage"
                 class="mt-3 text-primary"
                 style="display:none; font-weight:bold;">
                📧 Sending OTP to your registered email... Please wait.
            </div>

        </div>
    </form>
</div>

<div class="text-center mt-4">

<video id="video" width="300" height="220" autoplay class="border rounded"></video>
<br><br>

<button type="button" class="btn btn-primary" onclick="capturePhoto()">
📸 Capture Photo
</button>

<canvas id="canvas" width="300" height="220" style="display:none;"></canvas>

<input type="hidden" name="photo_data" id="photo_data">

</div>

<script>
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    alert("Camera access denied");
});

function capturePhoto(){

    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");

    context.drawImage(video, 0, 0, 300, 220);

    const imageData = canvas.toDataURL("image/png");

    document.getElementById("photo_data").value = imageData;

    alert("Photo captured successfully");
}
</script>


<script>
function showLoading() {

    document.getElementById("voteBtn").disabled = true;

    document.getElementById("loadingMessage").style.display = "block";

}
</script>

{% endblock %}
