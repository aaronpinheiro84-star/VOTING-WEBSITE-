<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OTP Verification - VoteSecure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(-45deg,#667eea,#764ba2,#6a11cb,#2575fc);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;
display:flex;
justify-content:center;
align-items:center;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:400px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(20px);
box-shadow:0 20px 50px rgba(0,0,0,0.5);
text-align:center;
color:white;
}

h2{
font-weight:700;
margin-bottom:15px;
}

.subtitle{
font-size:14px;
opacity:0.8;
margin-bottom:15px;
}

.timer{
font-size:14px;
margin-bottom:15px;
color:#ffd369;
}

.otp-input{
width:100%;
padding:15px;
border:none;
border-radius:50px;
outline:none;
background:rgba(255,255,255,0.2);
text-align:center;
font-size:22px;
letter-spacing:10px;
color:white;
margin-bottom:20px;
}

.otp-input:focus{
background:rgba(255,255,255,0.3);
box-shadow:0 0 15px rgba(0,242,254,0.8);
}

.verify-btn{
width:100%;
padding:14px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#00f2fe,#4facfe);
font-weight:600;
font-size:16px;
cursor:pointer;
color:white;
}

.verify-btn:hover{
transform:scale(1.05);
}

.messages{
margin-bottom:15px;
font-size:14px;
}

.success{
color:#00ffae;
}

.error{
color:#ff4b5c;
}

.secure-text{
margin-top:20px;
font-size:13px;
opacity:0.7;
}

.expired{
color:#ff4b5c;
font-weight:600;
margin-top:10px;
}


.camera-box{
margin-bottom:20px;
text-align:center;
}

video{
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

</style>
</head>

<body>

<div class="card">

<h2>🔐 OTP Verification</h2>
<div class="subtitle">Enter the OTP sent to your registered email</div>

<div class="timer">
OTP expires in <span id="countdown">02:00</span>
</div>

{% if messages %}
{% for message in messages %}
<div class="messages {{ message.tags }}">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST">
{% csrf_token %}
<div class="camera-box">

<video id="video" width="260" height="200" autoplay></video>

<canvas id="canvas" width="260" height="200" style="display:none;"></canvas>

<input type="hidden" name="photo_data" id="photo_data">

</div>
<input 
type="text"
name="otp"
class="otp-input"
placeholder="------"
maxlength="6"
pattern="[0-9]{6}"
inputmode="numeric"
required
>

<button type="submit" class="verify-btn">
Verify & Submit Vote
</button>

</form>

<div id="expiredMessage" class="expired" style="display:none;">
⏰ OTP expired. Please vote again.
</div>

<div class="secure-text">
🛡️ Your vote is encrypted and securely recorded.
</div>

</div>

<script>

let time = 120;

function startTimer(){
let countdown = document.getElementById("countdown");

let timer = setInterval(function(){

let minutes = Math.floor(time / 60);
let seconds = time % 60;

minutes = minutes < 10 ? "0" + minutes : minutes;
seconds = seconds < 10 ? "0" + seconds : seconds;

countdown.innerHTML = minutes + ":" + seconds;

time--;

if(time < 0){
clearInterval(timer);
document.getElementById("expiredMessage").style.display = "block";
}

},1000);
}

startTimer();

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(function(stream){
video.srcObject = stream;
})
.catch(function(){
alert("Camera access denied");
});

document.querySelector("form").addEventListener("submit", function(){

let canvas = document.getElementById("canvas");
let context = canvas.getContext("2d");

context.drawImage(video, 0, 0, 260, 200);

let imageData = canvas.toDataURL("image/png");

document.getElementById("photo_data").value = imageData;

});

</script>

</body>
</html>
